<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Cart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
</head>

<body style="margin: 0; padding: 0; font-family: 'Poppins', sans-serif; background-color: #0b0f19; color: #f8fafc;">

    <nav
        style="display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 2rem; background: rgba(11, 15, 25, 0.75); border-bottom: 1px solid rgba(255, 255, 255, 0.05); max-width: 1200px; margin: 0 auto;">
        <div style="font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; font-weight: 700; color: #22d3ee;">
            Sapan<span style="color: #fff;">Cart</span>
        </div>
        <a href="customer_home.html" style="color: #38bdf8; text-decoration: none; font-weight: 600;">
            <i class="fas fa-arrow-left"></i> Back to Shop
        </a>
    </nav>

    <main style="max-width: 900px; margin: 3rem auto; padding: 0 1.5rem;">
        <h2 style="font-family: 'Space Grotesk', sans-serif; font-size: 2rem; margin-bottom: 2rem; color: #fff;">Your
            Shopping Cart</h2>

        <div id="cartItemsContainer" style="display: flex; flex-direction: column; gap: 1rem;">
        </div>

        <div
            style="margin-top: 2rem; padding: 1.5rem; background: #131a2e; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <h3 style="margin: 0; font-size: 1.2rem;">Total Amount: <span id="totalPrice"
                    style="color: #22d3ee;">$0.00</span></h3>

            <div style="display: flex; gap: 10px;">
                <button onclick="clearCart()"
                    style="background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer;">
                    Clear Cart
                </button>

                <button onclick="proceedToCheckout()"
                    style="background: #22d3ee; color: #0b0f19; border: none; padding: 0.6rem 1.4rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s ease;">
                    Proceed to Checkout <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            renderCart();
        });

        function renderCart() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const container = document.getElementById('cartItemsContainer');
            const totalElement = document.getElementById('totalPrice');

            if (cart.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #64748b; font-size: 1.1rem;">Your cart is currently empty.</p>';
                totalElement.innerText = '$0.00';
                return;
            }

            let html = '';
            let total = 0;

            cart.forEach((item, index) => {
                let itemPrice = parseFloat(item.price) || 0;
                let itemQuantity = parseInt(item.quantity) || 1;
                let itemTotal = itemPrice * itemQuantity;
                total += itemTotal;

                html += `
                    <div style="display: flex; align-items: center; justify-content: space-between; background: #1e293b; padding: 1rem 1.5rem; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05);">
                        <div style="display: flex; align-items: center; gap: 1.2rem;">
                            <img src="${item.image || 'https://via.placeholder.com/60'}" width="60" height="60" style="object-fit: cover; border-radius: 8px;">
                            <div>
                                <h4 style="margin: 0 0 0.3rem 0; color: #fff; font-size: 1.1rem;">${item.name}</h4>
                                <p style="margin: 0; color: #94a3b8; font-size: 0.9rem;">$${itemPrice.toFixed(2)} x ${itemQuantity}</p>
                            </div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 1.5rem;">
                            <span style="font-weight: 700; color: #22d3ee; font-size: 1.1rem;">$${itemTotal.toFixed(2)}</span>
                            <button onclick="removeItem(${index})" style="background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer;">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            totalElement.innerText = '$' + total.toFixed(2);
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        function clearCart() {
            localStorage.removeItem('cart');
            renderCart();
        }

        function proceedToCheckout() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];

            if (cart.length === 0) {
                alert("Your cart is empty! Add products before checking out.");
                return;
            }

            localStorage.setItem('checkout_cart', JSON.stringify(cart));
            localStorage.removeItem('cart');
            window.location.href = "checkout_cart.html";
        }
    </script>
</body>

</html>
