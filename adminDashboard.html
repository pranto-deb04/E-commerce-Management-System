<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - E-Shopping</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background-color: #1e293b;
      padding: 20px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #334155;
    }

    .sidebar h2 {
      color: #38bdf8;
      font-size: 22px;
      margin-bottom: 30px;
      text-align: center;
    }

    .sidebar a {
      color: #94a3b8;
      text-decoration: none;
      padding: 12px 15px;
      margin-bottom: 10px;
      border-radius: 6px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background-color: #38bdf8;
      color: #0f172a;
    }

    .logout-btn {
      margin-top: auto;
      background-color: rgba(239, 68, 68, 0.1);
      color: #ef4444 !important;
      border: 1px solid rgba(239, 68, 68, 0.2);
      text-align: center;
    }

    .logout-btn:hover {
      background-color: #ef4444 !important;
      color: #ffffff !important;
    }

    .main-content {
      flex: 1;
      padding: 30px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 28px;
    }

    .btn-add {
      background-color: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .btn-add:hover {
      background-color: #7dd3fc;
    }

    .table-container {
      background-color: #1e293b;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th,
    td {
      padding: 15px;
      border-bottom: 1px solid #334155;
    }

    th {
      color: #94a3b8;
      font-size: 14px;
      text-transform: uppercase;
    }

    td {
      font-size: 15px;
    }

    .empty-msg {
      text-align: center;
      color: #94a3b8;
      padding: 20px;
    }
  </style>
</head>

<body>

  <div class="sidebar">
    <h2>Admin Panel</h2>
    <a href="adminDashboard.html" class="active">Products</a>
    <a href="logout.php" class="logout-btn">Logout</a>
  </div>

  <div class="main-content">
    <div class="header">
      <h1>Product Management</h1>
      <a href="addProducts.html" class="btn-add">+ Add New Product</a>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Product Name</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="productList">
          <tr>
            <td colspan="4" class="empty-msg">Loading products...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetchProducts();
    });

    function fetchProducts() {
      fetch('get_products.php')
        .then(response => response.json())
        .then(data => {
          const tableBody = document.getElementById('productList');
          tableBody.innerHTML = '';

          if (!data || data.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="4" class="empty-msg">No products available.</td></tr>';
            return;
          }

          data.forEach(product => {
            const row = document.createElement('tr');
            row.innerHTML = `
                            <td><b>${product.name}</b></td>
                            <td style="color: #38bdf8; font-weight: bold;">$${parseFloat(product.price).toFixed(2)}</td>
                            <td>${product.stock || 0}</td>
                            <td>
                                <button onclick="deleteProduct(${product.id})" style="background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Delete</button>
                            </td>
                        `;
            tableBody.appendChild(row);
          });
        })
        .catch(error => {
          document.getElementById('productList').innerHTML = '<tr><td colspan="4" class="empty-msg" style="color: #ef4444;">Failed to load products.</td></tr>';
        });
    }

    function deleteProduct(id) {
      if (confirm("Are you sure you want to delete this product?")) {
        fetch(`delete_product.php?id=${id}`, { method: 'DELETE' })
          .then(res => res.json())
          .then(data => {
            if (data.status === 'success') {
              fetchProducts();
            } else {
              alert('Failed to delete product');
            }
          })
          .catch(() => alert('Error deleting product'));
      }
    }
  </script>
</body>

</html>
