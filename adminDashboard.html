<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Shopping - Admin Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #ffffff;
    }

    header {
      background-color: #1e293b;
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #38bdf8;
      text-decoration: none;
    }

    .user-info {
      color: #94a3b8;
      font-style: italic;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .header-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .btn {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .btn-add {
      background-color: #38bdf8;
      color: #0f172a;
    }

    .btn-add:hover {
      background-color: #7dd3fc;
    }

    .btn-delete {
      background-color: transparent;
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-delete:hover {
      background-color: #ef4444;
      color: white;
    }

    .table-wrapper {
      background-color: #1e293b;
      border-radius: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #334155;
    }

    th {
      background-color: #0f172a;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .empty-msg {
      text-align: center;
      color: #64748b;
      padding: 40px;
      font-style: italic;
    }

    .stock-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-stock {
      width: 30px;
      height: 30px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #ffffff;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .btn-stock:hover {
      border-color: #38bdf8;
      color: #38bdf8;
    }
  </style>
</head>

<body>

  <header>
    <a href="#" class="logo">E-Shopping</a>
    <div class="user-info">Connecting to database...</div>
  </header>

  <div class="container">
    <div class="header-area">
      <h2>Product Management</h2>
      <a href="addProducts.html" class="btn btn-add">+ Add New Product</a>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Product Name</th>
            <th>Price</th>
            <th>Stock Qty</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="product-list">
          <tr id="no-data-row">
            <td colspan="4" class="empty-msg">No products found. Database not connected.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    function changeStock(id, amount) {
      const stockText = document.getElementById(id);
      let currentStock = parseInt(stockText.textContent);
      if (currentStock + amount >= 0) {
        stockText.textContent = currentStock + amount;
      }
    }

    function deleteProduct(button) {
      if (confirm("Are you sure?")) {
        button.parentElement.parentElement.remove();

        const tableBody = document.getElementById('product-list');
        if (tableBody.children.length === 0) {
          tableBody.innerHTML = `<tr id="no-data-row"><td colspan="4" class="empty-msg">No products found. Database not connected.</td></tr>`;
        }
      }
    }
  </script>
</body>

</html>
