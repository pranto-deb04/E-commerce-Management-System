<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Sapran Cart</title>
</head>

<body
    style="margin: 0; padding: 20px; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #fff;">

    <div id="checkoutContainer" style="max-width: 1100px; margin: 40px auto; padding: 20px;">

        <h1
            style="font-size: 28px; margin-bottom: 30px; border-bottom: 2px solid rgba(56, 189, 248, 0.2); padding-bottom: 10px;">
            Sapran <span style="color: #38bdf8;">Checkout</span>
        </h1>

        <div style="display: flex; flex-wrap: wrap; gap: 30px;">

            <div
                style="flex: 2; min-width: 300px; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid rgba(56, 189, 248, 0.1);">
                <h2 style="margin-top: 0; font-size: 20px; margin-bottom: 20px; color: #38bdf8;">Shipping Information
                </h2>

                <form id="checkoutForm">
                    <div style="margin-bottom: 20px;">
                        <label for="fullname"
                            style="display: block; font-size: 14px; color: #94a3b8; margin-bottom: 8px;">Full
                            Name</label>
                        <input type="text" id="fullname" name="fullname" placeholder="John Doe" required
                            style="width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 15px; outline: none; box-sizing: border-box;">
                    </div>

                    <div style="display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap;">
                        <div style="flex: 1; min-width: 200px;">
                            <label for="phone"
                                style="display: block; font-size: 14px; color: #94a3b8; margin-bottom: 8px;">Phone
                                Number</label>
                            <input type="tel" id="phone" name="phone" placeholder="017XXXXXXXX" required
                                style="width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 15px; outline: none; box-sizing: border-box;">
                        </div>
                        <div style="flex: 1; min-width: 200px;">
                            <label for="email"
                                style="display: block; font-size: 14px; color: #94a3b8; margin-bottom: 8px;">Email
                                Address</label>
                            <input type="email" id="email" name="email" placeholder="john@example.com" required
                                style="width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 15px; outline: none; box-sizing: border-box;">
                        </div>
                    </div>

                    <div style="margin-bottom: 20px;">
                        <label for="address"
                            style="display: block; font-size: 14px; color: #94a3b8; margin-bottom: 8px;">Street
                            Address</label>
                        <input type="text" id="address" name="address" placeholder="House no, Road no, Area..." required
                            style="width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 15px; outline: none; box-sizing: border-box;">
                    </div>

                    <div style="display: flex; gap: 20px; margin-bottom: 10px; flex-wrap: wrap;">
                        <div style="flex: 1; min-width: 200px;">
                            <label for="city"
                                style="display: block; font-size: 14px; color: #94a3b8; margin-bottom: 8px;">City</label>
                            <input type="text" id="city" name="city" placeholder="Dhaka" required
                                style="width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 15px; outline: none; box-sizing: border-box;">
                        </div>
                        <div style="flex: 1; min-width: 200px;">
                            <label for="zip"
                                style="display: block; font-size: 14px; color: #94a3b8; margin-bottom: 8px;">Postal /
                                ZIP Code</label>
                            <input type="text" id="zip" name="zip" placeholder="1212" required
                                style="width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 15px; outline: none; box-sizing: border-box;">
                        </div>
                    </div>
                </form>
            </div>

            <div style="flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 20px;">

                <div
                    style="background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid rgba(56, 189, 248, 0.1);">
                    <h2 style="margin-top: 0; font-size: 18px; margin-bottom: 15px; color: #fff;">Your Order</h2>

                    <div id="orderItemsContainer"></div>

                    <hr style="border: 0; border-top: 1px solid #334155; margin-bottom: 15px;">

                    <div
                        style="display: flex; justify-content: space-between; font-size: 14px; color: #94a3b8; margin-bottom: 8px;">
                        <span>Subtotal</span>
                        <span id="subtotalAmount">$0.00</span>
                    </div>
                    <div
                        style="display: flex; justify-content: space-between; font-size: 14px; color: #94a3b8; margin-bottom: 15px;">
                        <span>Shipping Fee</span>
                        <span id="shippingFee">$5.00</span>
                    </div>

                    <hr style="border: 0; border-top: 1px solid #334155; margin-bottom: 15px;">

                    <div
                        style="display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; color: #fff;">
                        <span>Total</span>
                        <span id="grandTotalAmount" style="color: #38bdf8;">$0.00</span>
                    </div>
                </div>

                <div
                    style="background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid rgba(56, 189, 248, 0.2); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);">
                    <h2 style="margin-top: 0; font-size: 18px; margin-bottom: 15px; color: #fff;">Payment Method</h2>

                    <label
                        style="display: flex; align-items: center; gap: 10px; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; margin-bottom: 12px; cursor: pointer;">
                        <input type="radio" name="payment" value="COD" checked style="accent-color: #38bdf8;">
                        <div>
                            <span style="display: block; font-size: 15px; font-weight: bold;">Cash on Delivery
                                (COD)</span>
                            <span style="font-size: 12px; color: #94a3b8;">Pay with cash upon delivery.</span>
                        </div>
                    </label>

                    <label
                        style="display: flex; align-items: center; gap: 10px; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; margin-bottom: 25px; cursor: pointer;">
                        <input type="radio" name="payment" value="Online Payment" style="accent-color: #38bdf8;">
                        <div>
                            <span style="display: block; font-size: 15px; font-weight: bold;">Online Payment</span>
                            <span style="font-size: 12px; color: #94a3b8;">Bkash, Nagad, Rocket or Credit Card</span>
                        </div>
                    </label>

                    <button type="button" id="submitBtn" onclick="triggerFormSubmit()"
                        style="width: 100%; padding: 14px; background: #38bdf8; border: none; border-radius: 8px; color: #0f172a; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s ease;">
                        Place Order (<span id="btnTotal">$0.00</span>)
                    </button>
                </div>

            </div>

        </div>
    </div>


    <div id="successContainer"
        style="display: none; max-width: 500px; margin: 80px auto; padding: 40px 30px; background: #1e293b; border-radius: 16px; border: 1px solid #22c55e; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        <div
            style="width: 70px; height: 70px; background-color: #15803d; color: #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; margin: 0 auto 20px auto;">
            ✓
        </div>
        <h2 style="color: #4ade80; margin: 0 0 10px 0; font-size: 26px;">Order Successful!</h2>
        <p style="color: #94a3b8; font-size: 15px; margin-bottom: 30px; line-height: 1.5;">
            Thank you for your purchase. Your order has been placed successfully and is being processed.
        </p>
        <button type="button" onclick="goToCustomerHome()"
            style="display: block; width: 100%; background-color: #38bdf8; color: #0f172a; text-decoration: none; padding: 14px 0; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; box-sizing: border-box; cursor: pointer;">
            Back to Home
        </button>
    </div>

    <script>
        let grandTotal = 0;
        let checkoutCart = [];

        document.addEventListener("DOMContentLoaded", function () {
            loadCheckoutCart();
        });

        function loadCheckoutCart() {
            checkoutCart = JSON.parse(localStorage.getItem('checkout_cart')) || [];
            const container = document.getElementById('orderItemsContainer');

            if (checkoutCart.length === 0) {
                container.innerHTML = '<p style="color: #94a3b8; font-size: 14px;">No items in checkout.</p>';
                document.getElementById('subtotalAmount').innerText = '$0.00';
                document.getElementById('grandTotalAmount').innerText = '$0.00';
                document.getElementById('btnTotal').innerText = '$0.00';

                document.getElementById('submitBtn').disabled = true;
                document.getElementById('submitBtn').style.opacity = '0.5';
                return;
            }

            let html = '';
            let subtotal = 0;

            checkoutCart.forEach(item => {
                let price = parseFloat(item.price) || 0;
                let quantity = parseInt(item.quantity) || 1;
                let itemTotal = price * quantity;
                subtotal += itemTotal;

                html += `
                    <div style="display: flex; justify-content: space-between; font-size: 14px; color: #94a3b8; margin-bottom: 10px;">
                        <span>${item.name} × ${quantity}</span>
                        <span style="color: #fff;">$${itemTotal.toFixed(2)}</span>
                    </div>
                `;
            });

            const shippingFee = 5.00;
            grandTotal = subtotal + shippingFee;

            container.innerHTML = html;
            document.getElementById('subtotalAmount').innerText = '$' + subtotal.toFixed(2);
            document.getElementById('grandTotalAmount').innerText = '$' + grandTotal.toFixed(2);
            document.getElementById('btnTotal').innerText = '$' + grandTotal.toFixed(2);
        }


        function triggerFormSubmit() {
            const form = document.getElementById('checkoutForm');

            if (checkoutCart.length === 0) {
                alert('Your cart is empty!');
                return;
            }

            if (form.checkValidity()) {
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.innerText = 'Processing...';
                submitBtn.disabled = true;

                const formData = new FormData(form);

                const selectedPayment = document.querySelector('input[name="payment"]:checked').value;
                formData.append('payment', selectedPayment);
                formData.append('cart_data', JSON.stringify(checkoutCart));
                formData.append('total_amount', grandTotal);

                fetch('place_order.php', {
                    method: 'POST',
                    body: formData
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === 'success') {
                            localStorage.removeItem('checkout_cart');
                            showSuccessScreen();
                        } else {
                            alert('Order Error: ' + (data.message || 'Something went wrong!'));
                            resetSubmitButton(submitBtn);
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('Server error! Make sure place_order.php is responding correctly.');
                        resetSubmitButton(submitBtn);
                    });

            } else {
                form.reportValidity();
            }
        }

        function resetSubmitButton(btn) {
            btn.innerText = 'Place Order ($' + grandTotal.toFixed(2) + ')';
            btn.disabled = false;
        }


        function showSuccessScreen() {
            document.getElementById('checkoutContainer').style.display = 'none';
            document.getElementById('successContainer').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function goToCustomerHome() {
            window.location.href = 'customer_home.html';
        }
    </script>

</body>

</html>
